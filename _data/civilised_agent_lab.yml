seminars:
  label: Group Seminars
  title: Group seminar schedule
  intro: A working forum for papers, experiments, design critiques, and careful disagreement around civilised agentic AI.
  section_label: Schedule
  section_title: Upcoming and planned sessions
  section_copy: Dates and venues will be confirmed by the lab. The first entries below establish the shape of the series without claiming a finalized public timetable.
  planned:
    - date: Date to be announced
      type: Reading seminar
      title: Emotional judgement and restraint in agentic AI
      copy: A discussion on timing, vulnerability, refusal, and the boundary between support and manipulation in conversational agents.
    - date: Date to be announced
      type: Work-in-progress
      title: Evaluating civilised agent behaviour
      copy: Early protocols for testing disclosure, repair, restraint, cultural context, and human impact in real agent workflows.
    - date: Date to be announced
      type: Design critique
      title: Aesthetic reasoning and creative co-agency
      copy: A critique session on agents for story, media, design, education, and heritage that preserve meaning while expanding imagination.
    - date: Date to be announced
      type: Research discussion
      title: Culture, plural values, and situated agency
      copy: A seminar on how agents might reason across tacit norms, histories, disagreement, and relationships where the right action depends on context.

