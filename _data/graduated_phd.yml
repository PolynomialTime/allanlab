- name: Yang Chen
  photo: yangchen.jpg
  duration: 2018. 11 -- 2022. 04
  email: yang.chen@auckland.ac.nz
  homepage: https://www.yangchen.info
  bio: I am currently a research fellow with the School of Computer Science, [The University of Auckland](https://www.auckland.ac.nz/). 
       I obtained my PhD in computer science from [The University of Auckland](https://www.auckland.ac.nz/), where I was supervised by Dr. Jiamou Liu and Prof. [Bakhadyr Khoussainov](https://www.cs.auckland.ac.nz/~bmk/). 
       I received the First Class Honours degree in computer science from The University of Auckland in 2018. Before coming to New Zealand, I received the B.S. in computer science from [Beijing Institute of Technology](https://english.bit.edu.cn) in 2017.
       My research interests span a spectrum of (inverse) reinforcement learning, computational game theory and multi-agent systems. Lately, my research focus is on applying reinforcement learning in large-scale multi-agent games, natural language processing and automatic reasoning.
       
       When I am not spending time on research and teaching, I can be found as a hiker and photography lover. I have hiked to many famous routes in many cities and towns across China and New Zealand. The collections of pictures that I took in the hike-way can be found in my [personal online gallery](https://instagram.com/yangchenphotography?igshid=NTc4MTIwNjQ2YQ==). 

- name: Mengxiao Zhang
  photo: mengxiao.jpg
  duration: 2017. 04 -- 2021. 11 
  email: mengxiao.zhang@auckland.ac.nz
  bio: I hold Bachelor's degree of Management in Information Management and Information Systems and Master's degree of management in Management Science and Engineering. My research interests are algorithmic mechanism design and economics of security and privacy. My current research focus is incentive mechanisms for data pricing and privacy preservation.
